name: HAL9000
options:
  bundleIdPrefix: com.sid
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    GCC_WARN_UNDECLARED_SELECTOR: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
targets:
  HALCore:
    type: library.static
    platform: macOS
    sources:
      - path: HALCore
    dependencies:
      - sdk: Security.framework
  HAL9000:
    type: application
    platform: macOS
    sources:
      - path: HAL9000
        excludes:
          - Info.plist
          - Resources
      - path: HAL9000/Resources
        buildPhase: resources
        excludes:
          - AppIcon.iconset
    dependencies:
      - target: HALCore
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
      - sdk: SceneKit.framework
      - sdk: ServiceManagement.framework
      - sdk: QuartzCore.framework
      - sdk: Carbon.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        INFOPLIST_FILE: HAL9000/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sid.hal9000
        PRODUCT_NAME: HAL9000
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        HEADER_SEARCH_PATHS: "$(SRCROOT)/HALCore"
        OTHER_LDFLAGS: "-ObjC"
  HAL9000Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HAL9000Tests
    dependencies:
      - target: HALCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sid.hal9000.tests
        HEADER_SEARCH_PATHS: "$(SRCROOT)/HALCore"
schemes:
  HAL9000:
    build:
      targets:
        HAL9000: all
        HAL9000Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HAL9000Tests
